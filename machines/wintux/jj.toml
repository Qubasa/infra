# Installed as /etc/jj/conf.d/10-defaults.toml.
# jj loads system config before ~/.config/jj/config.toml, so per-user
# settings still override everything here.

[user]
name = "Qubasa"
email = "consulting@qube.email"

[ui]
default-command = ["log", "--limit", "20"]
# Git-style hunks instead of the :color-words default. Readable in narrow
diff-formatter = ":git"
pager = ["delta", "--paging=always"]
# Git-style markers carry the base section, so `mergiraf solve` and any
# editor can see all three sides.
conflict-marker-style = "git"
# `jj resolve` opens the VS Code merge editor. `jj mresolve` tries mergiraf.
merge-editor = "vscode"

[merge-tools.difftastic]
program = "difft"
diff-args = ["--color=always", "--width=$width", "$left", "$right"]
diff-expected-exit-codes = [0, 1]

# jjui runs jj with JJUI=1 (set by its wrapper in packages.nix), so its diff
# view and preview use difftastic while terminal `jj diff` keeps :git + delta.
# jjui passes the pane width as COLUMNS, which jj forwards as $width.
[[--scope]]
--when.environments = ["JJUI=1"]
[--scope.ui]
diff-formatter = "difftastic"

# lazyjj runs jj with LAZYJJ=1 (set by its wrapper in packages.nix).
# Its diff pane is only part of the terminal, but jj and difft only see the
# full width, so difftastic renders inline there instead of side by side.
# `w` still cycles to color-words and git. `:resolve` uses mergiraf, and
# `:resolve --tool vscode` opens the VS Code merge editor.
[[--scope]]
--when.environments = ["LAZYJJ=1"]
[--scope.lazyjj]
diff-tool = "difftastic"
[--scope.ui]
merge-editor = "mergiraf"
[--scope.merge-tools.difftastic]
diff-args = ["--color=always", "--display=inline", "$left", "$right"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"

[aliases]
# Move the nearest bookmark up to @-, the usual "advance my branch" step.
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
# External viewers: VS Code side-by-side, difftastic in the terminal.
vdiff = ["diff", "--tool", "vscode"]
vshow = ["show", "--tool", "vscode"]
tdiff = ["diff", "--tool", "difftastic"]
# Structural merge with mergiraf. What it cannot settle stays a conflict.
mresolve = ["resolve", "--tool", "mergiraf"]
